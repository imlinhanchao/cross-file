name: ci

# Lightweight gate on every push/PR; release.yml reuses it via `workflow_call` before publishing.
# Actions minutes are limited, so the expensive browser/Docker suites are NOT run here:
#
#   gates          typecheck · unit · design · web build
#   go             Go server: gofmt · go vet · go test · static binary build
#   zero-storage   strace audit of the Go binary (cheap: no browser, no Docker)
#
# Run the full Playwright e2e and the container audit locally instead:
#   pnpm verify        # gate + full e2e + zero-storage audit
#   bash tests/audit/zero-storage.sh --container   # needs Docker
on:
  push:
    branches: [main, master]
  pull_request:
  # release.yml reuses the full gate suite before publishing a release.
  workflow_call:

# Keep the Go caches inside the workspace. `apps/signaling-go/build.sh` defaults to this layout
# (sandboxed machines have no writable $HOME), and actions/setup-go caches exactly these paths
# when they are exported, so CI and local runs share one cache story.
env:
  GOPATH: ${{ github.workspace }}/.cache/go
  GOMODCACHE: ${{ github.workspace }}/.cache/go/pkg/mod
  GOCACHE: ${{ github.workspace }}/.cache/go-build

jobs:
  gates:
    name: typecheck · unit · design · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm gate:contrast
      - run: pnpm gate:colors
      - run: pnpm --filter @crossfile/web build

  go:
    name: go (fmt · vet · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/signaling-go/go.mod
          cache-dependency-path: apps/signaling-go/go.sum
      - name: gofmt
        working-directory: apps/signaling-go
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "gofmt: all Go files formatted"
      - name: go vet
        working-directory: apps/signaling-go
        run: go vet ./...
      - name: go test
        working-directory: apps/signaling-go
        run: go test ./...
      - name: build static binary (SKIP_WEB)
        run: |
          set -euo pipefail
          SKIP_WEB=1 bash apps/signaling-go/build.sh
          test -x apps/signaling-go/bin/crossfile-signaling
          file apps/signaling-go/bin/crossfile-signaling
          ls -lh apps/signaling-go/bin/crossfile-signaling

  zero-storage:
    name: zero-storage audit (go binary)
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/signaling-go/go.mod
          cache-dependency-path: apps/signaling-go/go.sum
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: install strace if missing
        run: command -v strace >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y strace)
      - run: bash tests/audit/zero-storage.sh
