name: deploy

# Build → scp → pm2. For servers without Docker.
#
# Push to main (or run manually) builds the web app and the bundled signaling server,
# packs a release tarball, uploads it over SSH and reloads a PM2 process. The server
# keeps its own shared/.env (TURN_SECRET etc.); this workflow never writes secrets to
# disk there.
#
# Required repository secrets:
#   DEPLOY_HOST        server hostname or IP
#   DEPLOY_USER        ssh user (owns the deploy directory)
#   DEPLOY_SSH_KEY     private key for that user (ed25519 recommended)
#   DEPLOY_PATH        absolute path, e.g. /srv/crossfile
# Optional:
#   DEPLOY_PORT        ssh port (default 22)
#   PUBLIC_BASE_URL    e.g. https://room.example.com — smoke-tested after reload

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: build release tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Cheap deploy gate; the full matrix lives in ci.yml.
      - run: pnpm lint && pnpm typecheck && pnpm test

      - name: build web app
        run: pnpm --filter @crossfile/web build

      - name: bundle signaling server
        run: node infra/signaling/build.mjs .

      - name: assemble release
        shell: bash
        run: |
          rm -rf release
          mkdir -p release
          cp infra/signaling/build/server.cjs release/server.cjs
          cp -r apps/web/dist release/public
          cp infra/pm2/ecosystem.config.cjs release/ecosystem.config.cjs
          printf 'commit=%s\nbuilt=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release/VERSION
          tar -czf crossfile-signaling.tar.gz -C release .
          ls -lh crossfile-signaling.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: crossfile-signaling
          path: crossfile-signaling.tar.gz
          retention-days: 7

  deploy:
    name: upload & pm2 reload
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers under Settings → Environments → production if wanted.
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crossfile-signaling

      - name: prepare server directories
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ID: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,RELEASE_ID
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH/releases/$RELEASE_ID" "$DEPLOY_PATH/shared" "$DEPLOY_PATH/logs"
            if [ ! -f "$DEPLOY_PATH/shared/.env" ]; then
              echo "missing $DEPLOY_PATH/shared/.env on the server" >&2
              echo "create it once (TURN_SECRET, TURN_URIS, PORT, ...); see docs/self-host.md" >&2
              exit 1
            fi
            command -v pm2 >/dev/null || { echo "pm2 is not installed: npm i -g pm2" >&2; exit 1; }

      - name: upload release tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: crossfile-signaling.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}/releases/${{ github.sha }}
          overwrite: true

      - name: extract, reload pm2 and health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ID: ${{ github.sha }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          envs: DEPLOY_PATH,RELEASE_ID,PUBLIC_BASE_URL
          script: |
            set -euo pipefail
            ROOT="$DEPLOY_PATH"
            RELEASE="$ROOT/releases/$RELEASE_ID"

            tar -xzf "$RELEASE/crossfile-signaling.tar.gz" -C "$RELEASE"
            rm -f "$RELEASE/crossfile-signaling.tar.gz"

            # Secrets/config live only on the server.
            set -a
            . "$ROOT/shared/.env"
            set +a
            export PM2_LOG_DIR="$ROOT/logs"

            pm2 startOrReload "$RELEASE/ecosystem.config.cjs" --update-env
            pm2 save

            PORT="${PORT:-8788}"
            healthy=0
            for _ in $(seq 1 20); do
              if curl -fsS -o /dev/null --max-time 3 "http://127.0.0.1:${PORT}/"; then
                healthy=1
                break
              fi
              sleep 1
            done
            if [ "$healthy" != 1 ]; then
              echo "signaling is not responding on 127.0.0.1:${PORT}; last pm2 logs:" >&2
              pm2 logs crossfile-signaling --lines 40 --nostream >&2 || true
              exit 1
            fi

            ln -sfn "$RELEASE" "$ROOT/current"

            if [ -n "${PUBLIC_BASE_URL:-}" ]; then
              curl -fsS -o /dev/null --max-time 10 "$PUBLIC_BASE_URL/" \
                || { echo "public URL smoke test failed: $PUBLIC_BASE_URL" >&2; exit 1; }
              echo "public URL responds: $PUBLIC_BASE_URL"
            fi

            # Keep the five newest releases for rollback; drop older ones.
            ls -1dt "$ROOT"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
            echo "deployed $RELEASE to pm2 (port $PORT)"
