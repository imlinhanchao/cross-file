name: deploy

# Push to main (or manual run) builds the signaling image, publishes it to GHCR and
# rolls it out over SSH. The server keeps its own infra/.env (TURN_SECRET etc.);
# this workflow never writes secrets to disk there.
#
# Required repository secrets:
#   DEPLOY_HOST          server hostname or IP
#   DEPLOY_USER          ssh user (member of the docker group)
#   DEPLOY_SSH_KEY       private key for that user (ed25519 recommended)
#   DEPLOY_PATH          absolute path to the clone, e.g. /srv/crossfile
#   GHCR_PULL_TOKEN      PAT with read:packages (skip if the package is public)
# Optional:
#   DEPLOY_PORT          ssh port (default 22)
#   PUBLIC_BASE_URL      e.g. https://room.example.com — smoke-tested after rollout

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build & push signaling image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Cheap deploy gate; the full matrix lives in ci.yml.
      - run: pnpm lint && pnpm typecheck && pnpm test

      - name: image name and tag
        id: meta
        shell: bash
        run: |
          # GHCR requires a lowercase path.
          image="ghcr.io/${GITHUB_REPOSITORY,,}/signaling"
          sha="${GITHUB_SHA::12}"
          {
            echo "image=$image"
            echo "sha=$sha"
            echo "ref=$image:$sha"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/signaling/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: roll out over ssh
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers under Settings → Environments → production if wanted.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: sync compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "infra/docker-compose.yml,infra/docker-compose.hostnet.yml,infra/deploy/Caddyfile.example"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          # Keep the server's infra/.env intact: it is not in the repository.

      - name: pull and restart signaling
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.ref }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          envs: IMAGE,GHCR_PULL_TOKEN,GHCR_USER,DEPLOY_PATH,PUBLIC_BASE_URL
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            if [ ! -f infra/.env ]; then
              echo "infra/.env is missing on the server. Create it once from infra/.env.example" >&2
              echo "(TURN_SECRET, TURN_URIS, TURN_EXTERNAL_IP, PUBLIC_HOST, SIGNAL_PORT)." >&2
              exit 1
            fi

            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            export SIGNALING_IMAGE="$IMAGE"
            docker compose -f infra/docker-compose.yml pull signaling
            docker compose -f infra/docker-compose.yml up -d --remove-orphans

            container="$(docker compose -f infra/docker-compose.yml ps -q signaling)"
            status=starting
            for _ in $(seq 1 30); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$container" 2>/dev/null || echo unknown)"
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            if [ "$status" != "healthy" ]; then
              echo "signaling did not become healthy (status=$status); last logs:" >&2
              docker compose -f infra/docker-compose.yml logs --tail=40 signaling >&2
              exit 1
            fi
            echo "signaling is healthy on $IMAGE"

            if [ -n "${PUBLIC_BASE_URL:-}" ]; then
              curl -fsS -o /dev/null --max-time 10 "$PUBLIC_BASE_URL/" || { echo "public URL smoke test failed" >&2; exit 1; }
              echo "public URL responds: $PUBLIC_BASE_URL"
            fi

            docker image prune -f >/dev/null 2>&1 || true
