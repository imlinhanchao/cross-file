name: deploy

# Production deploy from a published GitHub Release (no Docker: tarball → scp → PM2).
#
# release.yml builds the artifacts and opens a draft release; publishing that release runs this
# workflow, which downloads the server tarball asset and deploys exactly the bytes that were
# released. The workflow never builds anything, so "deployed version == released version".
#
# Manual redeploy: run this workflow with the tag of an existing release.
#
# Required repository secrets:
#   DEPLOY_HOST        server hostname or IP
#   DEPLOY_USER        ssh user (owns the deploy directory)
#   DEPLOY_SSH_KEY     private key for that user (ed25519 recommended)
#   DEPLOY_PATH        absolute path, e.g. /var/www/rust/cross-file
# Optional:
#   DEPLOY_PORT        ssh port (default 22)
#   PUBLIC_BASE_URL    e.g. https://file.time-pack.com — smoke-tested after reload

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v0.1.0)"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: download release & pm2 reload
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_ID: ${{ github.event.release.tag_name || inputs.tag }}
      # How the server runs the binary: `pm2` (default, ecosystem.config.cjs shipped in the
      # tarball) or `systemd` (a unit generated by this workflow; ~80 MB less RAM than PM2).
      # Set the optional DEPLOY_MODE secret per target.
      DEPLOY_MODE: ${{ secrets.DEPLOY_MODE || 'pm2' }}
    steps:
      - name: download server tarball from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "crossfile-signaling-*-linux-x64.tar.gz" --dir release
          gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "SHA256SUMS" --dir release
          cd release
          sha256sum -c SHA256SUMS --ignore-missing
          ls -lh

      - name: prepare server directories
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          DEPLOY_MODE: ${{ env.DEPLOY_MODE }}
          DEPLOY_SERVICE_USER: ${{ secrets.DEPLOY_SERVICE_USER }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,RELEASE_ID,DEPLOY_MODE,DEPLOY_SERVICE_USER
          script: |
            set -euo pipefail
            # appleboy/ssh-action runs a non-login shell: load nvm so `pm2` is on PATH.
            source ~/.profile
            mkdir -p "$DEPLOY_PATH/releases/$RELEASE_ID" "$DEPLOY_PATH/shared" "$DEPLOY_PATH/logs"
            if [ ! -f "$DEPLOY_PATH/shared/.env" ]; then
              echo "missing $DEPLOY_PATH/shared/.env on the server" >&2
              echo "create it once (TURN_SECRET, TURN_URIS, PORT, ...); see docs/self-host.md" >&2
              exit 1
            fi
            if [ "${DEPLOY_MODE:-pm2}" = "systemd" ]; then
              command -v systemctl >/dev/null || { echo "systemctl is not available" >&2; exit 1; }
              # Generate (or refresh) the unit so a new target only needs this workflow plus
              # shared/.env. AF_NETLINK is required: pion/turn enumerates interfaces via netlink.
              cat > /etc/systemd/system/crossfile-signaling.service <<UNIT
            [Unit]
            Description=CrossFile signaling (Go single binary: web + WebSocket v2 + TURN)
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=${DEPLOY_SERVICE_USER:-root}
            WorkingDirectory=$DEPLOY_PATH/current
            EnvironmentFile=$DEPLOY_PATH/shared/.env
            ExecStart=$DEPLOY_PATH/current/crossfile-signaling
            Restart=always
            RestartSec=2
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            PrivateTmp=true
            PrivateDevices=true
            ProtectKernelTunables=true
            ProtectKernelModules=true
            ProtectControlGroups=true
            ReadOnlyPaths=$DEPLOY_PATH
            RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
            LimitNOFILE=65535

            [Install]
            WantedBy=multi-user.target
            UNIT
              systemctl daemon-reload
              systemctl enable crossfile-signaling >/dev/null 2>&1 || true
            else
              command -v pm2 >/dev/null || { echo "pm2 is not installed: npm i -g pm2" >&2; exit 1; }
            fi

      - name: upload release tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: release/crossfile-signaling-*-linux-x64.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}/releases/${{ env.RELEASE_ID }}
          # The downloaded asset lives in `release/`; strip that prefix so the tarball lands
          # directly in the release directory. Without this, scp-action recreates the nested
          # `release/` directory and the extraction step below cannot find the tarball (that is
          # exactly how the first v0.2.0 deploy failed).
          strip_components: 1
          overwrite: true

      - name: extract, reload pm2 and health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          DEPLOY_MODE: ${{ env.DEPLOY_MODE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          envs: DEPLOY_PATH,RELEASE_ID,PUBLIC_BASE_URL,DEPLOY_MODE
          script: |
            set -euo pipefail
            # appleboy/ssh-action runs a non-login shell: load nvm so `pm2` is on PATH.
            source ~/.profile
            ROOT="$DEPLOY_PATH"
            RELEASE="$ROOT/releases/$RELEASE_ID"

            # scp lands the tarball in the release directory (strip_components: 1 above). Accept
            # a nested `release/` too, so an older/newer scp-action behaviour cannot break a
            # deploy: find the asset wherever it landed, extract it and clean up the leftovers.
            TARBALL=$(find "$RELEASE" -maxdepth 2 -name 'crossfile-signaling-*-linux-x64.tar.gz' | head -1)
            if [ -z "$TARBALL" ]; then
              echo "release tarball not found under $RELEASE" >&2
              find "$RELEASE" -maxdepth 2 -ls >&2 || true
              exit 1
            fi
            tar -xzf "$TARBALL" -C "$RELEASE"
            rm -f "$TARBALL"
            rm -rf "$RELEASE/release"

            # Secrets/config live only on the server.
            set -a
            . "$ROOT/shared/.env"
            set +a
            export PM2_LOG_DIR="$ROOT/logs"

            if [ "${DEPLOY_MODE:-pm2}" = "systemd" ]; then
              # The unit runs $ROOT/current, so switch the symlink before restarting; the
              # generic `ln -sfn` after the health check below is then a no-op.
              ln -sfn "$RELEASE" "$ROOT/current"
              systemctl daemon-reload
              systemctl restart crossfile-signaling
            else
              # `startOrReload` keeps the script path from the first deploy, so a later release
              # could still point at a directory that the retention step has deleted. Delete +
              # start re-registers the release that was just unpacked.
              pm2 delete crossfile-signaling >/dev/null 2>&1 || true
              pm2 start "$RELEASE/ecosystem.config.cjs" --update-env
              pm2 save
            fi

            PORT="${PORT:-8788}"
            healthy=0
            for _ in $(seq 1 20); do
              if curl -fsS -o /dev/null --max-time 3 "http://127.0.0.1:${PORT}/"; then
                healthy=1
                break
              fi
              sleep 1
            done
            if [ "$healthy" != 1 ]; then
              if [ "${DEPLOY_MODE:-pm2}" = "systemd" ]; then
                echo "signaling is not responding on 127.0.0.1:${PORT}; last journal:" >&2
                journalctl -u crossfile-signaling --no-pager -n 40 >&2 || true
              else
                echo "signaling is not responding on 127.0.0.1:${PORT}; last pm2 logs:" >&2
                pm2 logs crossfile-signaling --lines 40 --nostream >&2 || true
              fi
              exit 1
            fi

            ln -sfn "$RELEASE" "$ROOT/current"

            if [ -n "${PUBLIC_BASE_URL:-}" ]; then
              curl -fsS -o /dev/null --max-time 10 "$PUBLIC_BASE_URL/" \
                || { echo "public URL smoke test failed: $PUBLIC_BASE_URL" >&2; exit 1; }
              echo "public URL responds: $PUBLIC_BASE_URL"
            fi

            # Keep the five newest releases for rollback; drop older ones.
            ls -1dt "$ROOT"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
            echo "deployed $RELEASE_ID to pm2 (port $PORT)"
