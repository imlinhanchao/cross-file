name: release

# Tag-driven release: build every shippable artifact, publish the GitHub Release, and trigger the
# production deploy.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# With a tag push the release is published automatically (draft: false). GitHub does NOT emit
# `release: published` for a release created with GITHUB_TOKEN (recursion prevention), so
# deploy.yml's release trigger would never fire for this workflow. The last step therefore
# dispatches deploy.yml explicitly with `gh workflow run` — workflow_dispatch is exempt from the
# recursion rule, so GITHUB_TOKEN is enough and deploy.yml needs no changes. `release: published`
# still covers a human publishing/re-publishing a release by hand, and deploy.yml's
# `workflow_dispatch` remains the manual redeploy path.
#
# `workflow_dispatch` with dry_run=true builds everything without creating a release or deploying.
#
# The server artifact is the Go single binary (`apps/signaling-go/`, see docs/05): one static
# executable that embeds the web app and runs the signaling WebSocket listener and TURN
# in-process, so a deployment needs no Node runtime and no separate coturn. The `web-dist`
# artifact is copied into the binary (`apps/signaling-go/webdist/`) before
# `apps/signaling-go/build.sh` runs. The x64 tarball keeps the historical asset name and the
# same `ecosystem.config.cjs` + `VERSION` layout, so deploy.yml works unchanged.
#
# Artifacts:
#   crossfile-signaling-<version>-linux-x64.tar.gz    unpack-and-deploy (Go binary + ecosystem + VERSION)
#   crossfile-signaling-<version>-linux-arm64.tar.gz  same for arm64 hosts
#   crossfile-signaling-<version>-linux-x64           single static Go binary (web app + TURN embedded)
#   crossfile-signaling-<version>-linux-arm64         same for arm64
#   CrossFile-<version>-x86_64.AppImage              Linux desktop (Electron)
#   CrossFile_<version>_x64_en-US.msi / *-setup.exe  Windows desktop (Tauri, unsigned)
#   CrossFile_<version>_universal.dmg                macOS desktop (Tauri, unsigned, universal)
#   CrossFile-<version>-android-arm64.apk            Android (Tauri, release-signed)
#   SHA256SUMS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (must match package.json)"
        required: true
      dry_run:
        description: "Build artifacts but do not create a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write
  # Needed by the final `gh workflow run deploy.yml` dispatch (triggering a workflow run).
  actions: write

# Keep the Go caches inside the workspace so actions/setup-go caches exactly the paths
# apps/signaling-go/build.sh uses by default (same story as ci.yml).
env:
  GOPATH: ${{ github.workspace }}/.cache/go
  GOMODCACHE: ${{ github.workspace }}/.cache/go/pkg/mod
  GOCACHE: ${{ github.workspace }}/.cache/go-build

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            DRY_RUN="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

  gates:
    name: gates (ci.yml)
    uses: ./.github/workflows/ci.yml

  verify:
    name: version check
    needs: [meta, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.mjs "${{ needs.meta.outputs.version }}"

  web:
    name: build web
    needs: [meta, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crossfile/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  server:
    name: server (go binary + tarballs)
    needs: [meta, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/signaling-go/go.mod
          cache-dependency-path: apps/signaling-go/go.sum
      - run: corepack enable
      - name: resolve version
        run: echo "VERSION=${{ needs.meta.outputs.version }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: build Go binaries (linux x64 + arm64, web app embedded)
        run: |
          set -euo pipefail
          # The binary embeds the web app; feed it the already-built web-dist artifact instead of
          # rebuilding the frontend here (`build.sh` skips its own web build with SKIP_WEB=1).
          mkdir -p apps/signaling-go/webdist
          cp -r apps/web/dist/. apps/signaling-go/webdist/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 SKIP_WEB=1 bash apps/signaling-go/build.sh
          cp apps/signaling-go/bin/crossfile-signaling "crossfile-signaling-${VERSION}-linux-x64"
          chmod 0755 "crossfile-signaling-${VERSION}-linux-x64"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 SKIP_WEB=1 bash apps/signaling-go/build.sh
          cp apps/signaling-go/bin/crossfile-signaling "crossfile-signaling-${VERSION}-linux-arm64"
          chmod 0755 "crossfile-signaling-${VERSION}-linux-arm64"
          file "crossfile-signaling-${VERSION}-linux-x64"
          file "crossfile-signaling-${VERSION}-linux-arm64"
          # CGO_ENABLED=0 must give a self-contained executable: no Node, no libc, no coturn.
          file "crossfile-signaling-${VERSION}-linux-x64" | grep -q "statically linked"
          file "crossfile-signaling-${VERSION}-linux-arm64" | grep -q "statically linked"
          echo "both binaries are static (CGO_ENABLED=0)"
      - name: smoke test binary (embedded app, SPA fallback, v1 version gate)
        run: |
          set -euo pipefail
          BIN="./crossfile-signaling-${VERSION}-linux-x64"
          PORT=18998 HOST=127.0.0.1 "$BIN" &
          BIN_PID=$!
          trap 'kill "$BIN_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null --max-time 1 http://127.0.0.1:18998/; then break; fi
            sleep 0.25
          done
          echo "-- embedded web app"
          curl -fsS http://127.0.0.1:18998/ | grep -q '<div id="root">'
          echo "GET / -> root element present"
          echo "-- SPA fallback"
          curl -fsS -o /dev/null http://127.0.0.1:18998/r/abcdefghijklmnopqrstuvwxyz
          echo "GET /r/<id> -> 200"
          echo "-- protocol v2 version gate (a v1 client must be told to reload)"
          node -e '
            const ws = new WebSocket(process.argv[1]);
            const timer = setTimeout(() => {
              console.error("v1 gate: timed out waiting for VERSION_MISMATCH");
              process.exit(1);
            }, 5000);
            ws.onopen = () => ws.send(JSON.stringify({ v: 1, type: "hello" }));
            ws.onmessage = (event) => {
              const message = JSON.parse(String(event.data));
              clearTimeout(timer);
              if (message.type !== "error" || message.code !== "VERSION_MISMATCH") {
                console.error("v1 gate: unexpected frame " + JSON.stringify(message));
                process.exit(1);
              }
              console.log("v1 gate ok: code=" + message.code + " msg=" + message.msg);
              ws.close();
              process.exit(0);
            };
            ws.onerror = () => {
              clearTimeout(timer);
              console.error("v1 gate: socket error");
              process.exit(1);
            };
          ' "ws://127.0.0.1:18998/v1/ws"
          ls -lh "crossfile-signaling-${VERSION}-linux-x64" \
                 "crossfile-signaling-${VERSION}-linux-arm64"
      - name: assemble tarballs
        run: |
          set -euo pipefail
          printf 'commit=%s\nversion=%s\nbuilt=%s\n' \
            "$GITHUB_SHA" "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > VERSION
          for arch in x64 arm64; do
            dir="release-$arch"
            rm -rf "$dir"
            mkdir -p "$dir"
            cp "crossfile-signaling-${VERSION}-linux-$arch" "$dir/crossfile-signaling"
            chmod 0755 "$dir/crossfile-signaling"
            # The Go PM2 config runs the binary with interpreter "none"; deploy.yml sources
            # shared/.env then `pm2 start <release>/ecosystem.config.cjs --update-env`.
            cp infra/pm2/ecosystem.go.config.cjs "$dir/ecosystem.config.cjs"
            chmod 0644 "$dir/ecosystem.config.cjs"
            cp VERSION "$dir/VERSION"
            tar -czf "crossfile-signaling-${VERSION}-linux-$arch.tar.gz" -C "$dir" .
          done
          echo "-- x64 tarball contents"
          tar -tzf "crossfile-signaling-${VERSION}-linux-x64.tar.gz"
          ls -lh "crossfile-signaling-${VERSION}-linux-x64.tar.gz" \
                 "crossfile-signaling-${VERSION}-linux-arm64.tar.gz" \
                 "crossfile-signaling-${VERSION}-linux-x64" \
                 "crossfile-signaling-${VERSION}-linux-arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            crossfile-signaling-*-linux-x64.tar.gz
            crossfile-signaling-*-linux-arm64.tar.gz
            crossfile-signaling-*-linux-x64
            crossfile-signaling-*-linux-arm64
          retention-days: 1

  desktop-linux:
    name: desktop linux (AppImage)
    needs: [meta, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: package AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @crossfile/desktop-electron package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: apps/desktop-electron/dist-electron/*.AppImage
          retention-days: 1

  desktop-windows:
    name: desktop windows (Tauri, unsigned)
    needs: [meta, web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: build Tauri bundles (unsigned)
        run: pnpm --filter @crossfile/desktop exec tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  desktop-macos:
    name: desktop macos (Tauri, unsigned, universal)
    needs: [meta, web]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: build universal dmg (unsigned)
        run: pnpm --filter @crossfile/desktop exec tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 1

  android:
    name: android (Tauri, signed)
    needs: [meta, web]
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CROSSFILE_KEYSTORE_PATH: ${{ github.workspace }}/.secrets/android-release.keystore
      CROSSFILE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CROSSFILE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CROSSFILE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: android sdk + ndk
        run: |
          set -euo pipefail
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/src-tauri/gen/android/**/*.gradle*', 'apps/mobile/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target
      - name: rust android targets
        run: rustup target add aarch64-linux-android
      - name: decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .secrets
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CROSSFILE_KEYSTORE_PATH"
          chmod 600 "$CROSSFILE_KEYSTORE_PATH"
      - name: require signing secrets
        run: |
          set -euo pipefail
          test -n "${CROSSFILE_KEYSTORE_PASSWORD:-}" || {
            echo "ANDROID_KEYSTORE_PASSWORD secret is not set; refusing to build a debug-signed APK" >&2
            exit 1
          }
          test -s "$CROSSFILE_KEYSTORE_PATH" || {
            echo "keystore missing at $CROSSFILE_KEYSTORE_PATH" >&2
            exit 1
          }
      - name: build signed APK
        run: pnpm --filter @crossfile/mobile exec tauri android build --apk --target aarch64
      - name: verify release signature
        run: |
          set -euo pipefail
          APK=$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk             -path '*release*' -name '*.apk' | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | grep -q "CN=CrossFile" || {
            echo "APK is not signed with the CrossFile release certificate" >&2
            exit 1
          }
      - name: collect APK
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          APK=$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk \
            -path '*release*' -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" "CrossFile-${VERSION}-android-arm64.apk"
          ls -lh "CrossFile-${VERSION}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: CrossFile-*-android-arm64.apk
          retention-days: 1

  release:
    name: publish release & dispatch deploy
    needs:
      [meta, server, desktop-linux, desktop-windows, desktop-macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # `web-dist` is a build input for the desktop/server jobs, not a release asset.
          pattern: "{server,desktop-linux,desktop-windows,desktop-macos,android}"
      - name: flatten artifacts and checksums
        run: |
          set -euo pipefail
          cd dist
          # upload-artifact keeps each artifact's internal paths; Windows bundles land in
          # msi/ and nsis/ subdirectories. Flatten them so every asset is a top-level file.
          find . -mindepth 2 -type f -exec mv -n {} . \;
          find . -mindepth 1 -type d -empty -delete
          if find . -mindepth 1 -type d | grep -q .; then
            echo "unexpected nested directories after flattening:" >&2
            find . -mindepth 1 -type d >&2
            exit 1
          fi
          ls -lh
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: publish release
        if: needs.meta.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: CrossFile ${{ needs.meta.outputs.version }}
          draft: false
          generate_release_notes: true
          files: dist/*
      - name: trigger deploy (workflow_dispatch)
        if: needs.meta.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A release created with GITHUB_TOKEN does not emit `release: published` (GitHub's
          # recursion prevention), so deploy.yml's event trigger never fires for this workflow.
          # workflow_dispatch IS exempt from that rule: dispatch the deploy explicitly.
          # deploy.yml stays unchanged (it still handles human-published releases and manual
          # redeploys through `release: published` / `workflow_dispatch`).
          dispatched=0
          for attempt in 1 2 3; do
            if gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" \
              --ref "$DEFAULT_BRANCH" -f "tag=${TAG}"; then
              dispatched=1
              echo "dispatched deploy.yml for ${TAG} on ${DEFAULT_BRANCH}"
              break
            fi
            echo "dispatch attempt ${attempt} failed; retrying in 5s" >&2
            sleep 5
          done
          if [ "$dispatched" != "1" ]; then
            echo "could not dispatch deploy.yml after 3 attempts; deploy manually: gh workflow run deploy.yml --ref ${DEFAULT_BRANCH} -f tag=${TAG}" >&2
            exit 1
          fi
          # Give the dispatched run a moment to appear, then print it as evidence.
          sleep 10
          echo "-- recent deploy runs (the new one has event=workflow_dispatch):"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 5 \
            --json databaseId,event,status,conclusion,headBranch,createdAt \
            --template '{{range .}}{{.databaseId}} event={{.event}} status={{.status}} conclusion={{.conclusion}} ref={{.headBranch}} createdAt={{.createdAt}}{{"\n"}}{{end}}'
      - name: dry run summary
        if: needs.meta.outputs.dry_run == 'true'
        run: |
          echo "dry run: artifacts built but no GitHub Release was created"
          ls -lh dist
