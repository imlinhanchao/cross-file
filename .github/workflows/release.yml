name: release

# Tag-driven release: build every shippable artifact and attach it to a draft GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The draft is published by hand (GitHub UI / `gh release edit --draft=false`); publishing
# triggers deploy.yml, which downloads the server tarball asset and deploys it.
# `workflow_dispatch` with dry_run=true builds everything without creating a release.
#
# Artifacts:
#   crossfile-signaling-<version>-linux-x64.tar.gz   unpack-and-deploy (server.cjs + public + ecosystem)
#   crossfile-signaling-<version>-linux-x64          single executable (Node SEA, web assets embedded)
#   CrossFile-<version>-x86_64.AppImage              Linux desktop (Electron)
#   CrossFile_<version>_x64_en-US.msi / *-setup.exe  Windows desktop (Tauri, unsigned)
#   CrossFile_<version>_universal.dmg                macOS desktop (Tauri, unsigned, universal)
#   CrossFile-<version>-android-arm64.apk            Android (Tauri, release-signed)
#   SHA256SUMS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (must match package.json)"
        required: true
      dry_run:
        description: "Build artifacts but do not create a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            DRY_RUN="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

  gates:
    name: gates (ci.yml)
    uses: ./.github/workflows/ci.yml

  verify:
    name: version check
    needs: [meta, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.mjs "${{ needs.meta.outputs.version }}"

  web:
    name: build web
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crossfile/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  server:
    name: server (tarball + binary)
    needs: [meta, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: assemble tarball
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          node infra/signaling/build.mjs .
          rm -rf release
          mkdir -p release
          cp infra/signaling/build/server.cjs release/server.cjs
          cp -r apps/web/dist release/public
          cp infra/pm2/ecosystem.config.cjs release/ecosystem.config.cjs
          printf 'commit=%s\nversion=%s\nbuilt=%s\n' \
            "$GITHUB_SHA" "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release/VERSION
          tar -czf "crossfile-signaling-${VERSION}-linux-x64.tar.gz" -C release .
      - name: build single binary (SEA)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          node infra/signaling/build-sea.mjs .
          cp infra/signaling/build/crossfile-signaling \
            "crossfile-signaling-${VERSION}-linux-x64"
          chmod +x "crossfile-signaling-${VERSION}-linux-x64"
          # Smoke test: embedded web assets + WebSocket listener must come up.
          PORT=18998 HOST=127.0.0.1 "./crossfile-signaling-${VERSION}-linux-x64" &
          BIN_PID=$!
          trap 'kill "$BIN_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null --max-time 1 http://127.0.0.1:18998/; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18998/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null http://127.0.0.1:18998/r/abcdefghijklmnopqrstuvwxyz
          ls -lh "crossfile-signaling-${VERSION}-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: server-tarball
          path: crossfile-signaling-*-linux-x64.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: crossfile-signaling-*-linux-x64
          retention-days: 1

  desktop-linux:
    name: desktop linux (AppImage)
    needs: [meta, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: package AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @crossfile/desktop-electron package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: apps/desktop-electron/dist-electron/*.AppImage
          retention-days: 1

  desktop-windows:
    name: desktop windows (Tauri, unsigned)
    needs: [meta, web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: build Tauri bundles (unsigned)
        run: pnpm --filter @crossfile/desktop exec tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  desktop-macos:
    name: desktop macos (Tauri, unsigned, universal)
    needs: [meta, web]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: build universal dmg (unsigned)
        run: pnpm --filter @crossfile/desktop exec tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 1

  android:
    name: android (Tauri, signed)
    needs: [meta, web]
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CROSSFILE_KEYSTORE_PATH: ${{ github.workspace }}/.secrets/android-release.keystore
      CROSSFILE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CROSSFILE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CROSSFILE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: android sdk + ndk
        run: |
          set -euo pipefail
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/src-tauri/gen/android/**/*.gradle*', 'apps/mobile/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target
      - name: rust android targets
        run: rustup target add aarch64-linux-android
      - name: decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .secrets
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CROSSFILE_KEYSTORE_PATH"
          chmod 600 "$CROSSFILE_KEYSTORE_PATH"
      - name: build signed APK
        run: pnpm --filter @crossfile/mobile exec tauri android build --apk --target aarch64
      - name: collect APK
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          APK=$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk \
            -path '*release*' -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" "CrossFile-${VERSION}-android-arm64.apk"
          ls -lh "CrossFile-${VERSION}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: CrossFile-*-android-arm64.apk
          retention-days: 1

  release:
    name: publish draft release
    needs:
      [meta, server, desktop-linux, desktop-windows, desktop-macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: flatten artifacts and checksums
        run: |
          set -euo pipefail
          cd dist
          # upload-artifact keeps each artifact's internal paths; Windows bundles land in
          # msi/ and nsis/ subdirectories. Flatten them so every asset is a top-level file.
          find . -mindepth 2 -type f -exec mv -n {} . \;
          find . -mindepth 1 -type d -empty -delete
          if find . -mindepth 1 -type d | grep -q .; then
            echo "unexpected nested directories after flattening:" >&2
            find . -mindepth 1 -type d >&2
            exit 1
          fi
          ls -lh
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: create draft release
        if: needs.meta.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: CrossFile ${{ needs.meta.outputs.version }}
          draft: true
          generate_release_notes: true
          files: dist/*
      - name: dry run summary
        if: needs.meta.outputs.dry_run == 'true'
        run: |
          echo "dry run: artifacts built but no GitHub Release was created"
          ls -lh dist
