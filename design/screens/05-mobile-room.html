<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrossFile · 手机房间（浅色）</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<div class="m-app">

  <header class="m-header">
    <span class="brand" style="font-size:0.9375rem">
      <span class="brand-mark" style="width:22px;height:22px" aria-hidden="true"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
  <path d="m21.854 2.147-10.94 10.939" />
</svg></span>
      CrossFile
    </span>
    <span class="spacer"></span>
    <span class="pill pill--secure"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" />
</svg><span>端到端加密</span></span>
    <button class="btn btn--ghost btn--sm" type="button">退出</button>
  </header>

  <main class="stack gap-4" aria-labelledby="room-title">
    <section class="m-hero" style="margin-top:var(--space-3)">
      <p class="eyebrow">房间 · 2 台设备</p>
      <h1 id="room-title" class="h1">给谁发文件？</h1>
      <p class="lead">同一房间的成员可以互传。你可以发给任何一台设备，也能收到别人发来的文件。</p>
    </section>

    <section class="card" aria-labelledby="members-title">
      <div class="card__head">
        <span class="card__title" id="members-title">成员 2/4</span>
        <span class="spacer"></span>
        <span class="card__hint">加入由管理员负责</span>
      </div>

      <ul class="receiver-list">
        <li class="receiver">
          <span class="receiver__tile"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z" />
  <path d="M20.054 15.987H3.946" />
</svg></span>
          <span class="stack" style="gap:1px; min-width:0">
            <span class="receiver__name">MacBook · <span class="name-code">7K2F</span></span>
            <span class="receiver__meta">macOS · 管理员 · 局域网直连</span>
          </span>
          <span class="receiver__actions">
            <button class="icon-btn" type="button" aria-label="给 MacBook · 7K2F 发文件"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
  <path d="m21.854 2.147-10.94 10.939" />
</svg></button>
          </span>
        </li>

        <li class="receiver receiver--self">
          <span class="receiver__tile"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
  <path d="M12 18h.01" />
</svg></span>
          <span class="stack" style="gap:1px; min-width:0">
            <span class="receiver__name">我 · iPhone · <span class="name-code">3Q9A</span></span>
            <span class="receiver__meta">iOS · 成员 · 这台设备</span>
          </span>
          <span class="receiver__actions">
            <button class="btn btn--ghost btn--sm" type="button">改名</button>
          </span>
        </li>
      </ul>

    </section>

    <div class="card card--inset">
      <div class="card__head">
        <span class="card__title">这个房间怎么传</span>
      </div>
      <div class="stack gap-2">
        <span class="note"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" />
</svg><span>每次接收都会先征求你的同意</span></span>
        <span class="note"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="12" cy="12" r="10" />
  <path d="M12 6v6l4 2" />
</svg><span>同一对设备一次只传一条，其他成员可以同时传</span></span>
        <span class="note"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
</svg><span>退出房间后，已接收的文件仍留在你的设备上</span></span>
      </div>
    </div>

    <p class="note"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" />
</svg><span>服务器不存一个字节 · 房间结束即销毁</span></p>
  </main>

  <div class="m-sticky">
    <button class="btn btn--primary btn--lg btn--block" type="button"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M12 3v12" />
  <path d="m17 8-5-5-5 5" />
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
</svg>选择文件</button>
  </div>
</div>
</body>
</html>
