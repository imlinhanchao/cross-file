<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrossFile · 手机完成（深色）</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<div class="m-app">

  <header class="m-header">
    <span class="brand" style="font-size:0.9375rem">
      <span class="brand-mark" style="width:22px;height:22px" aria-hidden="true"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
  <path d="m21.854 2.147-10.94 10.939" />
</svg></span>
      CrossFile
    </span>
    <span class="spacer"></span>
    <span class="pill pill--secure"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" />
</svg><span>零留存</span></span>
  </header>

  <main class="stack gap-4" aria-labelledby="done-title">
    <div class="complete-mark"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 6 9 17l-5-5" />
</svg></div>

    <section class="stack gap-2" style="text-align:center; align-items:center">
      <h1 id="done-title" class="h1">接收完成</h1>
      <p class="lead" style="max-width:34ch">2 个文件已通过 SHA-256 校验</p>
    </section>

    <div class="card">
      <ul class="file-list">
        <li class="file-row">
          <span class="file-tile"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
  <path d="M14 2v5a1 1 0 0 0 1 1h5" />
  <path d="M15.033 13.44a.647.647 0 0 1 0 1.12l-4.065 2.352a.645.645 0 0 1-.968-.56v-4.704a.645.645 0 0 1 .967-.56z" />
</svg></span>
          <span class="stack" style="gap:2px; min-width:0">
            <span class="file-name">product-demo-4k.mp4</span>
            <span class="file-meta">486.2 MB · 视频 · 已校验</span>
          </span>
        </li>
        <li class="file-row">
          <span class="file-tile"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
  <path d="M14 2v5a1 1 0 0 0 1 1h5" />
  <path d="M10 9H8" />
  <path d="M16 13H8" />
  <path d="M16 17H8" />
</svg></span>
          <span class="stack" style="gap:2px; min-width:0">
            <span class="file-name">brief-final.pdf</span>
            <span class="file-meta">12.4 MB · PDF · 已校验</span>
          </span>
        </li>
      </ul>
    </div>

    <div class="card">
      <div class="card__head">
        <span class="card__title">完整性</span>
        <span class="spacer"></span>
        <span class="pill pill--secure"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" />
</svg><span>校验通过</span></span>
      </div>
      <div class="hash-row">
        <svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 6 9 17l-5-5" />
</svg>
        <span class="mono">f5b7ea08…3c9d41</span>
        <button class="icon-btn" type="button" aria-label="复制 SHA-256" style="width:36px;height:36px"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
</svg></button>
      </div>
    </div>

    <p class="note"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="12" cy="12" r="10" />
  <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
  <path d="M2 12h20" />
</svg><span>来自 MacBook · <span class="name-code">7K2F</span> · 局域网直连 · 12 秒</span></p>

    <p class="note"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
</svg><span>房间仍在进行 · 你可以回到房间继续给成员发文件</span></p>
  </main>

  <div class="m-sticky">
    <div class="row gap-3">
      <button class="btn btn--ghost btn--lg" type="button">回到房间</button>
      <button class="btn btn--primary btn--lg" type="button" style="flex:1"><svg class="icon"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 6 9 17l-5-5" />
</svg>保存文件</button>
    </div>
  </div>
</div>
</body>
</html>
