# CrossFile self-hosting: ONE container, one static Go binary serving the web app, `/v1/ws`
# and an in-process TURN relay (docs/02 §7, docs/self-host.md).
#
#   cp infra/.env.example infra/.env    # then edit TURN_SECRET / TURN_URIS / TURN_EXTERNAL_IP
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml ps
#   docker compose -f infra/docker-compose.yml logs signaling
#   docker compose -f infra/docker-compose.yml down -v
#
# There is no coturn service and no Node runtime: the binary runs the TURN listener itself.
# Everything it might persist lives in RAM (rooms, rate-limit counters); the container runs with
# a read-only rootfs and the distroless non-root user, and has no volume.
name: crossfile

services:
  signaling:
    build:
      context: ..
      dockerfile: infra/signaling/Dockerfile
    # CI/deploy publishes this image to a registry; local development keeps building it.
    #   docker compose up -d --build            -> builds crossfile/signaling:local
    #   SIGNALING_IMAGE=ghcr.io/you/cross-file/signaling:sha docker compose pull signaling
    image: ${SIGNALING_IMAGE:-crossfile/signaling:local}
    restart: unless-stopped
    read_only: true
    # distroless/static `nonroot` (uid/gid 65532); the process never writes.
    # No `init: true`: the Go binary is PID 1, handles SIGTERM itself and spawns no children,
    # so no injected docker-init file is needed (this also keeps `docker diff` empty for the
    # zero-storage audit).
    user: "65532:65532"
    environment:
      PORT: "8787"
      # Must bind 0.0.0.0 inside the container: a published port cannot reach 127.0.0.1.
      HOST: "0.0.0.0"
      # docs/02 §6.7: empty TURN_URIS means "no TURN offered". The in-process TURN listener
      # starts only when TURN_URIS and TURN_SECRET are BOTH non-empty (same gate as the old
      # Node server); TURN_EXTERNAL_IP is required only then.
      TURN_URIS: ${TURN_URIS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # Address that TURN relay candidates advertise: the host's public IPv4 on a VPS,
      # 127.0.0.1 for two browsers on this machine, the LAN IP for a phone on the same Wi-Fi.
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      # Inside-container listener; the published host port must stay equal to it.
      TURN_LISTEN_PORT: "3478"
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
      # Room capacity excluding the admin (docs/01 D6); empty means the server default (4).
      MAX_MEMBERS: ${MAX_MEMBERS:-}
    ports:
      - "${SIGNAL_BIND:-0.0.0.0}:${SIGNAL_PORT:-8788}:8787"
      # TURN listener + relay allocation range. Relay ports are advertised to browsers, so the
      # published range must equal the container's TURN_MIN_PORT/TURN_MAX_PORT.
      - "${TURN_BIND:-0.0.0.0}:${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_BIND:-0.0.0.0}:${TURN_PORT:-3478}:3478/udp"
      - "${TURN_BIND:-0.0.0.0}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    # No healthcheck: the runtime image is distroless (no shell, no curl/node). Readiness is
    # the `/v1/ws` listener; the deploy workflow probes `http://127.0.0.1:$PORT/` from the host.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    # Docker's own log file is bounded; the app emits exactly one startup line and no access logs.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    stop_grace_period: 10s
