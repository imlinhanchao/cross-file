# CrossFile self-hosting: signaling + coturn, one .env, no volumes, no database (docs/02 §7).
#
#   cp infra/.env.example infra/.env    # then edit TURN_SECRET / TURN_URIS / PUBLIC_HOST
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml ps
#   docker compose -f infra/docker-compose.yml logs signaling
#   docker compose -f infra/docker-compose.yml down -v
#
# Everything the signaling container might persist lives in RAM (rooms, rate-limit counters).
# The container itself runs with a read-only rootfs and a non-root user; there is no volume.
#
# For a local relay test (browser on the same machine), also load the host-network override so
# TURN relay candidates carry the host's address:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.hostnet.yml up -d --build
name: crossfile

services:
  signaling:
    build:
      context: ..
      dockerfile: infra/signaling/Dockerfile
    image: crossfile/signaling:local
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    init: true
    environment:
      PORT: "8787"
      # Must bind 0.0.0.0 inside the container: a published port cannot reach 127.0.0.1.
      HOST: "0.0.0.0"
      # docs/02 §6.7: empty TURN_URIS means "no TURN offered"; credentials are then omitted.
      TURN_URIS: ${TURN_URIS:-}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in infra/.env (cp infra/.env.example infra/.env)}
      NODE_ENV: production
    ports:
      - "${SIGNAL_BIND:-0.0.0.0}:${SIGNAL_PORT:-8787}:8787"
    healthcheck:
      # The image has no curl/wget; Node 22 ships a global WebSocket. A completed upgrade on
      # /v1/ws is enough to prove the listener is serving (no message is sent or logged).
      test:
        - CMD
        - node
        - -e
        - >-
          const ws = new WebSocket("ws://127.0.0.1:8787/v1/ws");
          const timer = setTimeout(() => process.exit(1), 3000);
          ws.onopen = () => { clearTimeout(timer); ws.close(); process.exit(0); };
          ws.onerror = () => { clearTimeout(timer); process.exit(1); };
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    # Docker's own log file is bounded; the app emits exactly one startup line and no access logs.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    stop_grace_period: 10s

  coturn:
    image: coturn/coturn:4.19.2-alpine
    restart: unless-stopped
    # docs/02 §6.7: coturn static-auth-secret mode matches packages/signaling/src/turn.ts
    #   username   = "<expiryEpoch>:<peerId>"
    #   credential = base64(HMAC-SHA1(TURN_SECRET, username))
    # `no-loopback-peers` is intentionally NOT set: local development needs loopback relay.
    command:
      - --listening-port=3478
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in infra/.env (cp infra/.env.example infra/.env)}
      - --realm=crossfile
      - --no-cli
      - --no-multicast-peers
      - --fingerprint
      - --no-tls
      - --no-dtls
      - --min-port=${COTURN_MIN_PORT:-49160}
      - --max-port=${COTURN_MAX_PORT:-49200}
      # Lowest verbosity: no -v/-V flags; all logs to stdout, nothing to disk.
      - --log-file=stdout
      - --simple-log
      - --new-log-timestamp
    ports:
      - "${COTURN_BIND:-0.0.0.0}:${COTURN_PORT:-3478}:3478/tcp"
      - "${COTURN_BIND:-0.0.0.0}:${COTURN_PORT:-3478}:3478/udp"
      # Relay allocation range; keep it equal to the container's --min-port/--max-port.
      - "${COTURN_BIND:-0.0.0.0}:${COTURN_MIN_PORT:-49160}-${COTURN_MAX_PORT:-49200}:${COTURN_MIN_PORT:-49160}-${COTURN_MAX_PORT:-49200}/udp"
    # No volumes: coturn writes no persistent state in this configuration.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
